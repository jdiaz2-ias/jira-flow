name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: make check test-race build
      - run: ./bin/jflow version --format=json
      - name: Dependencies stay tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - if: runner.os == 'Linux'
        run: make build-all security
